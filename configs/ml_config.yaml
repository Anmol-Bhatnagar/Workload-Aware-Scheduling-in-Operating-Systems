# Machine Learning Policy Recommender Configuration

model:
  algorithm: "DecisionTreeClassifier"
  max_depth: 4
  min_samples_leaf: 5
  random_state: 42
  criterion: "gini"

features:
  - "process_count"
  - "mean_initial_burst"
  - "std_initial_burst"
  - "burst_cv"
  - "mean_io_wait"
  - "multi_burst_ratio"
  - "cpu_to_io_ratio"
  - "mean_arrival_gap"
  - "std_arrival_gap"
  - "short_burst_ratio"
  - "priority_std"
  - "arrival_burstiness"

labels:
  - "FCFS"
  - "SJF"
  - "PRIORITY"
  - "RR_Q2"
  - "RR_Q5"
  - "RR_Q10"

objective_weights:
  primary:
    response_cost: 0.30
    waiting_cost: 0.25
    turnaround_cost: 0.20
    context_switch_cost: 0.15
    utilisation_cost: 0.10
  alternative_sensitivity:
    response_cost: 0.40
    waiting_cost: 0.20
    turnaround_cost: 0.20
    context_switch_cost: 0.10
    utilisation_cost: 0.10

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_state: 42
  stratify_by: "workload_family"
